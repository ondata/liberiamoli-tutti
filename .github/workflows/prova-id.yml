name: TEMP - prova italiadomani UA

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: italiadomani con e senza User-Agent
        run: |
          T="https://www.italiadomani.gov.it/content/dam/sogei-ng/opendata/PNRR_Gare.csv"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          echo "== senza UA: headers e corpo"
          curl -sS -D - -o /tmp/senza.txt -r 0-200 "$T" | head -12
          echo "--- corpo ---"; cat /tmp/senza.txt; echo

          echo "== con UA Chrome"
          curl -sS -D - -o /tmp/con.txt -r 0-200 -A "$UA" "$T" | head -12
          echo "--- corpo ---"; head -c 300 /tmp/con.txt; echo

          echo "== con UA Chrome, download intero (max 60s)"
          curl -sS -A "$UA" -o /tmp/full.csv -w "  http=%{http_code} size=%{size_download}\n" --max-time 60 "$T" || echo "  exit=$?"

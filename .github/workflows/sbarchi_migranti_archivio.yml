name: Archivio PDF e dati del cruscotto statistico sbarchi migranti

on:
  schedule:
    - cron: '0 6 * * 1,4'  # lunedì e giovedì alle 6:00 UTC
  workflow_dispatch:  # Permette l'esecuzione manuale

jobs:
  archivia:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: crea cartella utente bin, copia dentro l'eseguibile mlr
      run: |-
        mkdir -p ~/bin
        cp bin/mlrgo ~/bin/mlr
        chmod +x ~/bin/mlr

    - name: installa pdftotext
      run: |-
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    - uses: astral-sh/setup-uv@v6

    - name: archivia i PDF
      id: archivia
      run: |-
        export PATH=~/bin:$PATH
        ./sbarchi-migranti/script/archivia_pdf.sh

    # i PDF già archiviati sono puntatori Git LFS: estrai.py legge la loro estrazione da rawdata/estratti
    # ed elabora solo i PDF appena scaricati
    - name: estrai e valida i dati
      run: |-
        cd sbarchi-migranti
        uv run script/estrai.py

    - name: Commit e push se ci sono cambiamenti
      if: always() && steps.archivia.outcome == 'success'
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git pull
        git add sbarchi-migranti/rawdata/pdf sbarchi-migranti/rawdata/estratti sbarchi-migranti/dati
        git commit -m "archivio PDF e dati cruscotto sbarchi migranti: $(date -I)" || exit 0
        git push
